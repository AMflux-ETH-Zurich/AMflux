            [mode.CSP.comm.torque_offset]
            tor_offset = 0



    # ----------------------------
    # Cyclic Synchronous Velocity (CSV)
    # ----------------------------


        #CONFIGURATION PARAMETERS

            [mode.CSV.conf.motor_init]
            nominal_current = 5000
            tor_const = 2000000

            [mode.CSV.conf.current_control_parameter_init]
