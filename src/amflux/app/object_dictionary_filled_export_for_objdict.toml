# =========================================================
# MOTOR
# =========================================================

    [motor.axis_configuration_init]
    sens_res  = 32768
    sys_speed = 1000

    [motor.motor_init]
    motor_type      = 10
    nominal_current = 5000
    current_lim     = 30000
    pole_pairs      = 10
    therm_const     = 10000
    tor_const       = 2000000

    [motor.electrical_system_init]
    electrical_resistance = 2261
    electrical_inductance = 14160

    [motor.velocity_observer_parameter_init]
    pos_corr_gain  = 400
    vel_corr_gain  = 100000
    load_corr_gain = 33
    friction       = 10
    inertia        = 1000

    [motor.dual_loop_position_control_parameter_init]
    main_loop_p_gain_low              = 10000
    main_loop_p_gain_high             = 100000
    main_loop_gain_scheduler          = 12500
    main_loop_filter_coeff_a          = "None"
    main_loop_filter_coeff_b          = "None"
    main_loop_filter_coeff_c          = "None"
    main_loop_filter_coeff_d          = "None"
    main_loop_filter_coeff_e          = "None"
    auxiliary_loop_p_gain             = "None"
    auxiliary_loop_i_gain             = 1000
    auxiliary_loop_ff_velocity_gain   = 1000
    auxiliary_loop_ff_acceleration_gain = 1000
    auxiliary_loop_observer_pos_corr_gain = 1000
    auxiliary_loop_observer_vel_corr_gain = 1000
    auxiliary_loop_observer_load_corr_gain = "None"
    auxiliary_loop_observer_friction  = "None"
    auxiliary_loop_observer_inertia   = "None"
    dual_loop_miscellaneous           = "None"

    [motor.si_unit_position]
    si_unit_pos = 0x00B50000

    [motor.si_unit_velocity]
    si_unit_vel = 0x00B44700

    [motor.si_unit_acceleration]
    si_unit_acc = 0x00C00300

    [motor.position_offset]
    pos_offset = 0

    [motor.velocity_offset]
    vel_offset = 0

    [motor.torque_offset]
    tor_offset = 0

    [motor.digital_outputs]
    phys_outputs = 0x00000000

    #[motor.motor_rated_torque]
    #rated_torque = "None"

    [motor.motor_type]
    motor_type = 10


# =========================================================
# ENCODER
# =========================================================

    [encoder.ssi_abs_encoder_init]
    data_rate                   = 2000
    data_bits                   = 0x00000F00
    encoding_type               = 0x0011
    timeout_time                = 30
    power_up_time               = 200
    commutation_offset_value    = 2100
    position_bits               = 0x0000000F
    #not in eds file: communication_additional_delay = -1


# =========================================================
# SAFETY / LIMITS / GENERIC PROTECTION
# =========================================================

    [safety.abort_connection_option_init]
    abort_option = 2

    #[safety.mode_of_operation_init]
    #op_mode = "None"

    [safety.following_error_window_init]
    following_error_window = 4294967295

    [safety.following_error_timeout_init]
    following_error_timeout = 0

    [safety.position_window_init]
    position_window = 4294967295

    [safety.position_window_time_init]
    position_window_time = 0

    [safety.shutdown_option_code]
    option_code = 0

    [safety.disable_operation_option_code]
    option_code = 0

    #[safety.halt_option_code]
    #option_code = 2

    [safety.fault_reaction_option_code]
    option_code = 2

    [safety.software_position_limit]
    min_pos_limit = 0
    max_pos_limit = 0

    [safety.max_profile_velocity]
    max_velocity = 200

    [safety.max_motor_speed]
    max_velocity = 1000

    [safety.max_acceleration]
    max_acc = 100000


# =========================================================
# MODE-SPECIFIC PARAMETERS
# =========================================================

    # ----------------------------
    # Profile Position Mode (PPM)
    # ----------------------------

        #CONFIGURATION PARAMETERS

            [mode.PPM.conf.software_position_limit]
            min_pos_limit = 0
            max_pos_limit = 0

            [mode.PPM.conf.max_profile_velocity]
            max_velocity = 340

            [mode.PPM.conf.max_motor_speed]
            max_velocity = 1000

            [mode.PPM.conf.quick_stop_deceleration]
            prof_dec = 100

            [mode.PPM.conf.max_acceleration]
            max_acc = 100000


        #COMMANDING PARAMETERS

            [mode.PPM.comm.target_position]
            position = 0

            [mode.PPM.comm.profile_velocity]
            prof_velocity = 300

            [mode.PPM.comm.profile_acceleration]
            prof_acc = 100

            [mode.PPM.comm.profile_deceleration]
            prof_dec = 100


    # ----------------------------
    # Homing Mode (HMM)
    # ----------------------------

        #CONFIGURATION PARAMETERS

            [mode.HMM.conf.digital_input_properties_init]
            polarity = 0x0000

            [mode.HMM.conf.config_digital_inputs_init]
            input_1_config = 255
            input_2_config = 255
            input_3_config = 255
            input_4_config = 255
            input_5_config = 255
            input_6_config = 255
            input_7_config = 255
            input_8_config = 255

            [mode.HMM.conf.motion_profile_type]
            profile = 0

        #COMMANDING PARAMETERS

            [mode.HMM.comm.homing_method_init]
            homing_method = 37

            [mode.HMM.comm.homing_speeds]
            speed_sw_srch = 100
            speed_zero_srch = 10

            [mode.HMM.comm.homing_acceleration]
            homing_acc = 10

            [mode.HMM.comm.home_offset_distance_init]
            home_offset_distance = 0

            [mode.HMM.comm.home_position_init]
            homeposition = 0

            [mode.HMM.comm.current_threshold_homing_init]
            current_threshold_homing = 500
            

    # ----------------------------
    # Profile Velocity Mode (PVM)
    # ----------------------------

        #CONFIGURATION PARAMETERS

            [mode.PVM.conf.software_position_limit]
            min_pos_limit = 0
            max_pos_limit = 0

            [mode.PVM.conf.max_profile_velocity]
            max_velocity = 340

            [mode.PVM.conf.max_motor_speed]
            max_velocity = 1000

            #Left out max gear speed

            [mode.PVM.conf.quick_stop_deceleration]
            prof_dec = 100

            [mode.PVM.conf.max_acceleration]
            max_acc = 100000


        #COMMANDING PARAMETERS

            [mode.PVM.comm.target_velocity]
            vel = 0

            [mode.PVM.comm.profile_acceleration]
            prof_acc = 100

            [mode.PVM.comm.profile_deceleration]
            prof_dec = 100

            [mode.PVM.comm.motion_profile_type]
            profile = 0


    # ----------------------------
    # Cyclic Synchronous Position (CSP)
    # ----------------------------

        #CONFIGURATION PARAMETERS

            [mode.CSP.conf.motor_init]
            nominal_current = 5000
            tor_const = 2000000

            [mode.CSP.conf.current_control_parameter_init]
            p_gain = 7347747
            i_gain = 1235943

            [mode.CSP.conf.position_control_parameter_init]
            p_gain = 8594189
            i_gain = 93631411
            d_gain = 250576
            ffv_gain = 12371
            ffa_gain = 2682
            i_gain_si_unit = 0xFA040300

            [mode.CSP.conf.quick_stop_deceleration]
            prof_dec = 100

            [mode.CSP.conf.profile_deceleration]
            prof_dec = 100

            [mode.CSP.conf.following_error_window_init]
            following_error_window = 4294967295

            [mode.CSP.conf.software_position_limit]
            min_pos_limit = 0
            max_pos_limit = 0

            [mode.CSP.conf.motor_rated_torque]
            rated_torque = 10000000

            [mode.CSP.conf.max_motor_speed]
            max_velocity = 1000

            #Left out max gear speed

            [mode.CSP.conf.interpolation_time_period]
